<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noite Branca - Preparar Post</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #0b0b1a; 
            color: white;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loader-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #dc2743;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { margin: 0 0 10px 0; font-size: 22px; }
        p { color: #ccc; font-size: 15px; line-height: 1.4; margin-bottom: 15px; }
        .tags-highlight {
            background: rgba(220, 39, 67, 0.2);
            color: #ff4a6b;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            font-family: monospace;
            display: inline-block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="loader-container">
    <div class="spinner"></div>
    <h2>A preparar o Instagram...</h2>
    <p>Copiamos as seguintes tags para o teu telemóvel:</p>
    
    <div class="tags-highlight" id="textoParaCopiar">@asuasite #NoiteBranca</div>
    
    <p style="font-size: 13px; color: #888;">A abrir a câmara em 3 segundos... Quando tirar a foto, basta fazer <b>Colar</b>!</p>
</div>

<script>
window.onload = function() {
    const texto = document.getElementById("textoParaCopiar").innerText;

    // 1. Copia o texto assim que a página abre
    navigator.clipboard.writeText(texto).then(() => {
        console.log("Texto copiado com sucesso!");
    }).catch(err => {
        console.log("Erro ao copiar automaticamente");
    });

    // 2. Aguarda 3000 milissegundos (3 segundos) antes de saltar para o Instagram
    setTimeout(function() {
        window.location.href = "instagram://story-camera";
        
        // Fallback caso a app falhe
        setTimeout(() => {
            window.location.href = "https://instagram.com/asuasite";
        }, 1500);
    }, 3000); 
};
</script>

</body>
</html>
