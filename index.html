<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noite Branca - Partilhar</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #0b0b1a; 
            color: white;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 25px;
            border-radius: 20px;
            max-width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .tags-box {
            background: rgba(220, 39, 67, 0.15);
            color: #ff4a6b;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-family: monospace;
            font-size: 16px;
            margin: 20px 0;
            border: 1px dashed rgba(220, 39, 67, 0.4);
        }
        .btn-insta {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
            padding: 16px 32px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(220, 39, 67, 0.4);
            transition: transform 0.2s;
        }
        .btn-insta:active {
            transform: scale(0.98);
        }
        h2 { margin: 0 0 10px 0; font-size: 24px; }
        p { color: #ccc; font-size: 14px; line-height: 1.4; margin: 0; }
    </style>
</head>
<body>

<div class="card">
    <h2>Noite Branca 🌟</h2>
    <p>Clica abaixo para copiar as tags e abrir a tua câmara do Instagram automaticamente.</p>
    
    <div class="tags-box" id="textoParaCopiar">@asuasite #NoiteBranca</div>

    <button class="btn-insta" onclick="copiarEAbrir()">Copiar e Abrir Instagram</button>
    
    <p style="font-size: 12px; color: #777; margin-top: 20px;">Quando a câmara abrir, tira a foto, toca no ecrã e escolhe <b>Colar</b>!</p>
</div>

<script>
function copiarEAbrir() {
    const texto = document.getElementById("textoParaCopiar").innerText;

    // Copia o texto (funciona sempre porque foi acionado por um clique real)
    navigator.clipboard.writeText(texto).then(() => {
        // Abre imediatamente a câmara de Stories do Instagram
        window.location.href = "instagram://story-camera";
        
        // Fallback caso a app não responda
        setTimeout(() => {
            window.location.href = "https://instagram.com/asuasite";
        }, 1500);
    }).catch(err => {
        // Se houver algum erro de permissão do browser, abre a app na mesma
        window.location.href = "instagram://story-camera";
    });
}
</script>

</body>
</html>
