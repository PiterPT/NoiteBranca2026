<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noite Branca - A Redirecionar...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #0b0b1a; /* Tema escuro estilo Noite Branca */
            color: white;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loader-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        /* Animação simples de loading */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #dc2743;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { margin: 0 0 10px 0; font-size: 22px; }
        p { color: #aaa; font-size: 14px; margin: 0; }
    </style>
</head>
<body>

<div class="loader-container">
    <div class="spinner"></div>
    <h2>A abrir o Instagram...</h2>
    <p>As tags já foram copiadas! Quando a câmara abrir, basta tocares no ecrã e selecionar "Colar".</p>
    
    <div id="textoSecreto" style="display: none;">@asuasite #NoiteBranca</div>
</div>

<script>
// Esta função corre automaticamente assim que a página termina de carregar
window.onload = function() {
    const textoParaCopiar = document.getElementById("textoSecreto").innerText;

    // Tenta copiar o @ e a hashtag para o telemóvel do utilizador
    navigator.clipboard.writeText(textoParaCopiar).then(() => {
        redirecionarParaInsta();
    }).catch(err => {
        // Se o navegador do telemóvel bloquear a cópia automática (raro), abre o Insta na mesma
        redirecionarParaInsta();
    });
};

function redirecionarParaInsta() {
    // Força a abertura da câmara de Stories do Instagram
    window.location.href = "instagram://story-camera";
    
    // Fallback: Se o telemóvel demorar a responder ou não tiver a app, vai para o perfil web
    setTimeout(() => {
        window.location.href = "https://instagram.com/mordomiasaopedro";
    }, 1500);
}
</script>

</body>
</html>
